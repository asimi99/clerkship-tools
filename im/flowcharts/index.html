<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Internal Medicine Flowcharts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../site.css?v=7">
<style>
*{box-sizing:border-box}
body{font-size:15px;line-height:1.55}
.wrap{margin:0;padding:24px max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px)) 56px max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px))}
.search{width:100%;max-width:440px;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.fc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;cursor:pointer;text-align:left;font:inherit;padding:0}
.fc:hover{border-color:var(--accent-2);transform:translateY(-2px)}
.fc .pv{height:150px;overflow:hidden;padding:12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:9px;line-height:1.35;pointer-events:none;position:relative}
.fc .pv::after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(transparent,var(--bg))}
.fc .pv .ft{gap:5px}.fc .pv .fn{padding:3px 6px;border-radius:5px}.fc .pv .fb{gap:4px;margin-left:6px;padding-left:8px}.fc .pv .br::before{left:-8px;width:6px;top:8px}.fc .pv .bl{font-size:7px}
.fc div.t{padding:12px 14px;display:flex;gap:10px;align-items:baseline}
.fc .n{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;flex:none}
.fc b{font-size:14.5px;font-weight:600;line-height:1.35}
.ft{display:grid;gap:10px}
.fn{display:inline-block;padding:8px 12px;border-radius:8px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);max-width:72ch;justify-self:start}
.ft>.fn{font-weight:600}
.fb{display:grid;gap:8px;margin-left:14px;padding-left:16px;border-left:2px solid var(--line)}
.br{position:relative;display:grid;gap:6px}
.br::before{content:"";position:absolute;left:-16px;top:16px;width:12px;border-top:2px solid var(--line)}
.bl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.br>.fn{background:var(--surface);border-color:var(--line)}
.fn.end{background:color-mix(in srgb,#c4231c 7%,var(--surface));border-color:color-mix(in srgb,#c4231c 28%,transparent)}
b.hy{color:#c4231c}
.lb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.lb-top{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.lb-top h2{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0}
.lb button{font:600 14px var(--font,inherit);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;height:36px;padding:0 12px;cursor:pointer}
.lb-body{flex:1;overflow:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 28px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chips a{font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:5px 11px;text-decoration:none}
.chips span{font-size:13px;color:var(--muted);padding:5px 2px;font-weight:600}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="pagehead"><h1>Internal Medicine Flowcharts</h1><p id="sub"></p></header>
  <input class="search" id="q" type="search" placeholder="Search: chest pain, hyponatremia, AFib, anemia..." aria-label="Search flowcharts">
  <div class="grid" id="grid"></div>
</div>
<div class="lb" id="lb" hidden></div>
<script src="../data.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../../config.js?v=3"></script>
<script src="../../auth.js?v=3"></script>
<script src="../../nav.js?v=21"></script>
<script>
var FCS=window.FC||[],V={};(window.VIDS||[]).forEach(function(v){V[v.key]=v;});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="hy">$1</b>');}
function tree(n){if(!n)return'';function node(x){if(typeof x==='string')return'<div class="fn end">'+rich(x)+'</div>';var k=(x.b||[]).map(function(c){return'<div class="br">'+(c.l?'<span class="bl">'+rich(c.l)+'</span>':'')+node(c.n)+'</div>';}).join('');return'<div class="fn'+(k?'':' end')+'">'+rich(x.t)+'</div>'+(k?'<div class="fb">'+k+'</div>':'');}return'<div class="ft">'+node(n)+'</div>';}
function flat(n){if(!n)return'';if(typeof n==='string')return n;return n.t+' '+(n.b||[]).map(function(c){return(c.l||'')+' '+flat(c.n);}).join(' ');}
function short(s){s=s.replace(/^Approach to /,'');return s.charAt(0).toUpperCase()+s.slice(1);}
function fmt(t){t=Math.floor(t);var h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
document.getElementById('sub').textContent=FCS.length+' approach flowcharts for the '+(window.SHELF?SHELF.name:'')+' shelf. Tap one to open it full size, then jump to the video moments that cover it.';
var grid=document.getElementById('grid'),lb=document.getElementById('lb');
function draw(q){var t=(q||'').toLowerCase().split(/\s+/).filter(Boolean);var list=FCS.filter(function(f){var s=(f.name+' '+flat(f.tree)).toLowerCase().replace(/\*/g,'');return t.every(function(w){return s.indexOf(w)>=0;});});
grid.innerHTML=list.length?list.map(function(f){return'<button class="fc" data-n="'+f.n+'"><div class="pv">'+tree(f.tree)+'</div><div class="t"><span class="n">'+f.n+'</span><b>'+esc(short(f.name))+'</b></div></button>';}).join(''):'<p class="empty">Nothing matched. Try one word.</p>';}
function open(n){var i=FCS.findIndex(function(f){return f.n===n;}),f=FCS[i];if(!f){close();return;}
var chips=Object.keys(f.chips||{}).map(function(k){var v=V[k];if(!v||!f.chips[k].length)return'';return'<span>'+esc(v.short||v.label)+'</span>'+f.chips[k].map(function(x){return'<a href="../#'+k+'-t'+Math.floor(x[0])+'">'+(v.approx?'≈ '+fmt(x[0])+' (PDF '+esc(x[1])+')':esc(x[1]))+'</a>';}).join('');}).join('');
lb.innerHTML='<div class="lb-top"><button data-go="'+((FCS[i-1]||{}).n||'')+'"'+(i?'':' disabled')+' aria-label="Previous">‹</button><h2>'+f.n+' · '+esc(short(f.name))+'</h2><button data-go="'+((FCS[i+1]||{}).n||'')+'"'+(FCS[i+1]?'':' disabled')+' aria-label="Next">›</button><button data-x>Close</button></div><div class="lb-body">'+(chips?'<div class="chips">'+chips+'</div>':'')+tree(f.tree)+'</div>';
lb.hidden=false;document.body.style.overflow='hidden';}
function close(){lb.hidden=true;document.body.style.overflow='';}
grid.addEventListener('click',function(e){var b=e.target.closest('.fc');if(b)location.hash='c'+b.dataset.n;});
lb.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-x'))location.hash='';else if(b.dataset.go)location.hash='c'+b.dataset.go;});
document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')location.hash='';});
function route(){var m=location.hash.match(/^#c(\w+)/);if(m)open(m[1]);else close();}
addEventListener('hashchange',route);
document.getElementById('q').addEventListener('input',function(e){draw(e.target.value);});
draw('');route();
</script>
</body>
</html>
