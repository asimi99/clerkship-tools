<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asim Ibrahim's Clerkship Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2210%22%20fill%3D%22%231d4f8f%22/%3E%3Cpath%20fill%3D%22%23fff%22%20fill-rule%3D%22evenodd%22%20d%3D%22M4%2030%20L11.5%2010%20H15%20L22.5%2030%20H18.8%20L17.2%2025.5%20H9.3%20L7.7%2030%20Z%20M10.6%2022%20H15.9%20L13.25%2014.5%20Z%22/%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M24%2010%20H35%20V13.2%20H31.2%20V26.8%20H35%20V30%20H24%20V26.8%20H27.8%20V13.2%20H24%20Z%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="site.css?v=3">
<style>
*{box-sizing:border-box}
body{font-size:15px;line-height:1.55}
.home{max-width:1000px;margin:0 auto;padding:44px max(16px,env(safe-area-inset-left,0px)) 64px}
.hero{margin-bottom:30px}
.hero h1{font-size:clamp(28px,5vw,40px);line-height:1.12;letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance}
.hero h1 b{color:var(--accent)}.hero h1 b.si{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:1.06em}
.hero p{margin:0;color:var(--muted);font-size:16px;max-width:58ch}
.tools{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.tool{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.tool:hover{border-color:var(--accent-2);transform:translateY(-2px)}
.ic{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.tool b{font-size:17px;letter-spacing:-.01em}
.tool span{color:var(--muted);font-size:14px;flex:1}
.tool i{font-style:normal;font-weight:600;font-size:14px;color:var(--accent)}
.shelves{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.shelves button{font:600 14px var(--font);border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:7px 14px;cursor:pointer}
.shelves button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.group{margin-bottom:28px}.group h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.empty{color:var(--muted);font-size:14px;margin:0}

</style>
</head>
<body>
<main class="home">
  <section class="hero">
    <h1><b>A</b>sim <b class="si">I</b>brahim's Clerkship Tools</h1>
    <p>Study tools for clerkship and shelf prep. Use everything as a guest, or create an account to save your progress.</p>
  </section>
  <nav class="shelves" id="shelves" aria-label="Filter by shelf"></nav>
  <div id="groups"></div>
</main>
<script>
var IC={"stem": "<path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>", "exam": "<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6M8 13h8M8 17h5\"/>", "fc": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"5\" rx=\"1\"/><rect x=\"14\" y=\"16\" width=\"7\" height=\"5\" rx=\"1\"/><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1\"/><path d=\"M6.5 8v8M6.5 12h11v4\"/>", "vid": "<rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"3\"/><path d=\"M10 9l5 3-5 3z\"/>"};
var TOOLS=[
 {g:'general',name:'Stem Coach',href:'./stem-coach/',ic:'stem',d:'Add a screenshot of any question. It coaches you to the answer one decision at a time.'},
 {g:'general',name:'Practice Exams',href:'./exam/',ic:'exam',d:'Upload PDFs of questions and answers. It builds an NBME-style test and explains every answer after.'},
 {g:'peds',name:'Peds Flowcharts',href:'./flowcharts/',ic:'fc',d:'40 approach flowcharts for the peds shelf, full size, with links to the video moments.'},
 {g:'peds',name:'Peds Videos',href:'https://asimi99.github.io/peds-shelf/',ic:'vid',d:'Review videos split by topic with exact timestamps, plus a playlist for every system.'}
];
var SHELVES=[['all','All'],['general','General'],['obgyn','OB/GYN'],['peds','Pediatrics'],['im','Internal Medicine'],['fm','Family Medicine'],['psych','Psychiatry'],['surg','Surgery']];
var cur='all'; try{cur=localStorage.getItem('ct_shelf')||'all'}catch(e){}
function card(t){return '<a class="tool" href="'+t.href+'"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[t.ic]+'</svg></span><b>'+t.name+'</b><span>'+t.d+'</span><i>Open</i></a>';}
function draw(){
 document.getElementById('shelves').innerHTML=SHELVES.map(function(s){return '<button type="button" data-s="'+s[0]+'"'+(s[0]===cur?' class="on"':'')+'>'+s[1]+'</button>';}).join('');
 var list=cur==='all'?SHELVES.slice(1):SHELVES.filter(function(s){return s[0]===cur;});
 var h='';
 list.forEach(function(s){var ts=TOOLS.filter(function(t){return t.g===s[0];}); if(!ts.length&&cur==='all')return; h+='<section class="group"><h2>'+s[1]+'</h2>'+(ts.length?'<div class="tools">'+ts.map(card).join('')+'</div>':'<p class="empty">No tools for this shelf yet.</p>')+'</section>';});
 document.getElementById('groups').innerHTML=h;
}
document.getElementById('shelves').addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;cur=b.dataset.s;try{localStorage.setItem('ct_shelf',cur)}catch(x){}draw();});
draw();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js?v=3"></script>
<script src="./auth.js?v=3"></script>
<script src="./nav.js?v=6"></script>
</body>
</html>
